<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solaire – Configuration</title>
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface-2:#1e1e1e;--line:#2a2a2a;--red:#e10600;--red-soft:#ff4d4d;--red-dim:#4a0a0a;--white:#fff;--text-2:#b3b3b3;--text-3:#6b6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--white);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:420px;margin:0 auto;padding:24px 16px}
h1{font-size:22px;margin:0 0 4px}
h1 span{color:var(--red)}
p{color:var(--text-2);margin:0 0 20px}
form{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
label{display:block;font-size:14px;color:var(--text-2);margin:14px 0 6px}
label:first-child{margin-top:0}
input{width:100%;padding:11px 12px;background:var(--surface-2);color:var(--white);border:1px solid var(--line);border-radius:8px;font:inherit}
input:focus{outline:2px solid var(--red);outline-offset:1px;border-color:transparent}
input.bad{border-color:var(--red)}
small{display:block;color:var(--text-3);font-size:13px;margin-top:4px}
button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:8px;background:var(--red);color:var(--white);font-family:inherit;font-size:16px;font-weight:600;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#msg{margin-top:16px;padding:12px;border-radius:8px;display:none}
#msg.err{display:block;background:var(--red-dim);color:var(--white)}
#msg.ok{display:block;background:var(--surface-2);border:1px solid var(--line)}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1><span>●</span> Solaire – Configuration</h1>
<p>Connectez le gestionnaire au WiFi de la maison et choisissez le mot de passe administrateur.</p>
<form id="f" novalidate>
  <div id="cur-box" class="hide">
    <label for="cur">Mot de passe administrateur actuel</label>
    <input id="cur" type="password" autocomplete="current-password">
  </div>
  <label for="wifi_ssid">Réseau WiFi (SSID)</label>
  <input id="wifi_ssid" maxlength="32" required autocomplete="off">
  <label for="wifi_pass">Mot de passe WiFi</label>
  <input id="wifi_pass" type="password" maxlength="63" autocomplete="off">
  <small>Vide pour un réseau ouvert, sinon 8 caractères minimum.</small>
  <label for="admin_pass">Nouveau mot de passe administrateur</label>
  <input id="admin_pass" type="password" maxlength="64" autocomplete="new-password">
  <small>8 caractères minimum. Exigé pour modifier les paramètres.</small>
  <label for="admin_pass2">Confirmation</label>
  <input id="admin_pass2" type="password" maxlength="64" autocomplete="new-password">
  <label for="hostname">Nom sur le réseau</label>
  <input id="hostname" maxlength="31" value="solaire" autocomplete="off">
  <small>Interface accessible ensuite sur http://<b id="hn">solaire</b>.local</small>
  <button id="go" type="submit">Enregistrer et redémarrer</button>
  <div id="msg" role="status"></div>
</form>
</main>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var adminSet = false;
  var labels = {
    'sys.wifi_ssid': 'wifi_ssid', 'sys.wifi_pass': 'wifi_pass',
    'sys.admin_pass': 'admin_pass', 'sys.hostname': 'hostname'
  };
  function msg(text, ok) { var m = $('msg'); m.textContent = text; m.className = ok ? 'ok' : 'err'; }
  function mark(id) {
    document.querySelectorAll('input').forEach(function (i) { i.classList.remove('bad'); });
    if (id && $(id)) { $(id).classList.add('bad'); $(id).focus(); }
  }
  $('hostname').addEventListener('input', function () { $('hn').textContent = this.value || 'solaire'; });

  fetch('/api/system').then(function (r) { return r.json(); }).then(function (s) {
    adminSet = !!s.admin_set;
    if (adminSet) {
      $('cur-box').classList.remove('hide');
      $('admin_pass').placeholder = 'inchangé si vide';
    }
    if (s.hostname) { $('hostname').value = s.hostname; $('hn').textContent = s.hostname; }
  }).catch(function () {});

  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var ssid = $('wifi_ssid').value, wp = $('wifi_pass').value;
    var ap = $('admin_pass').value, ap2 = $('admin_pass2').value;
    if (!ssid) { mark('wifi_ssid'); return msg('Indiquez le nom du réseau WiFi.'); }
    if (wp && wp.length < 8) { mark('wifi_pass'); return msg('Mot de passe WiFi : 8 caractères minimum.'); }
    if (!adminSet && !ap) { mark('admin_pass'); return msg('Choisissez un mot de passe administrateur.'); }
    if (ap && ap.length < 8) { mark('admin_pass'); return msg('Mot de passe administrateur : 8 caractères minimum.'); }
    if (ap !== ap2) { mark('admin_pass2'); return msg('Les deux mots de passe administrateur diffèrent.'); }
    mark(null);
    var body = { wifi_ssid: ssid, wifi_pass: wp, hostname: $('hostname').value };
    if (ap) { body.admin_pass = ap; }
    var headers = { 'Content-Type': 'application/json' };
    if (adminSet) { headers['X-Admin-Password'] = $('cur').value; }
    $('go').disabled = true;
    fetch('/api/setup', { method: 'POST', headers: headers, body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (res.ok) {
          msg('Enregistré. Redémarrage… Reconnectez-vous au WiFi « ' + ssid +
              ' » puis ouvrez http://' + ($('hostname').value || 'solaire') + '.local', true);
        } else {
          $('go').disabled = false;
          mark(labels[res.j.field] || (res.j.field ? null : 'cur'));
          msg('Refusé : ' + res.j.error + (res.j.field ? ' (' + res.j.field + ')' : ''));
        }
      })
      .catch(function () { $('go').disabled = false; msg('Pas de réponse du gestionnaire.'); });
  });
})();
</script>
</body>
</html>
